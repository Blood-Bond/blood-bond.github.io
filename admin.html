<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#991b1b"><title>Blood Bond Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff7f7;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}header{background:#991b1b;color:white;padding:20px}.wrap{max-width:850px;margin:auto;padding:18px}h1{font-size:23px;margin:0}h2{font-size:20px;color:#991b1b;margin:0 0 12px}.card{background:white;border:1px solid #fee2e2;border-radius:15px;padding:18px;margin:14px 0}label{display:block;font-weight:700;margin:12px 0 5px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;font-size:14px;cursor:pointer}.primary{background:#991b1b;color:white;width:100%;margin-top:14px}.approve{background:#166534;color:white}.reject{background:#991b1b;color:white}.logout{background:#e5e7eb;color:#111827}.muted{color:#64748b;font-size:13px}.msg{padding:11px;border-radius:9px;margin-top:12px;background:#fff7ed;color:#9a3412;overflow-wrap:anywhere}.ok{background:#f0fdf4;color:#166534}.bad{background:#fef2f2;color:#991b1b}.item{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.tag{display:inline-block;background:#fee2e2;color:#991b1b;border-radius:7px;padding:3px 8px;font-weight:900}.hidden{display:none}a{color:#991b1b}
</style></head><body>
<header><div class="wrap"><h1>🩸 Blood Bond — Admin</h1><div>রক্তদাতার আবেদন যাচাই ও অনুমোদন</div></div></header>
<main class="wrap">
<section id="loginCard" class="card"><h2>অ্যাডমিন লগইন</h2><p class="muted">শুধু Supabase-এ তৈরি করা অনুমোদিত অ্যাডমিন অ্যাকাউন্ট দিয়ে প্রবেশ করুন।</p>
<form id="loginForm"><label>অ্যাডমিন ইমেইল</label><input name="email" type="email" required autocomplete="username"><label>পাসওয়ার্ড</label><input name="password" type="password" required autocomplete="current-password"><button class="primary" type="submit">লগইন</button></form><div id="loginMsg" class="msg hidden" aria-live="polite"></div></section>
<section id="dashboard" class="hidden"><div class="row" style="justify-content:space-between"><h2>অপেক্ষমাণ রক্তদাতার আবেদন</h2><button id="logoutBtn" class="logout">লগআউট</button></div><div id="dashMsg" class="msg" aria-live="polite">তথ্য লোড হচ্ছে…</div><div id="donorList"></div></section>
<div class="muted">Blood Bond Admin · অ্যাডমিন অনুমতি ডেটাবেসে যাচাই করা হয়।</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://bkkityifiuvotwirwcqz.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_rGH4uYPFyQlY0Kkd-LCYkA_1bngDwRS";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
function msg(id,text,kind="msg"){const el=$(id);el.className="msg "+kind;el.textContent=text;}
function showDashboard(on){$("loginCard").classList.toggle("hidden",on);$("dashboard").classList.toggle("hidden",!on);}
async function isAdmin(){const {data:userData,error:userError}=await db.auth.getUser();if(userError||!userData.user)throw userError||new Error("লগইন নেই");const {data,error}=await db.from("admin_users").select("user_id").eq("user_id",userData.user.id).maybeSingle();if(error)throw error;return !!data;}
async function loadDonors(){msg("dashMsg","আবেদন লোড হচ্ছে…");const {data,error}=await db.from("donors").select("id,name,phone,whatsapp,blood_group,district,upazila,created_at,status").eq("status","pending").order("created_at",{ascending:true});if(error){msg("dashMsg","আবেদন দেখা যায়নি: "+error.message,"bad");return;}$("donorList").innerHTML="";if(!data.length){msg("dashMsg","এখন কোনো অপেক্ষমাণ আবেদন নেই।","ok");return;}msg("dashMsg",`মোট ${data.length}টি আবেদন অপেক্ষমাণ।`,"ok");data.forEach(d=>{const box=document.createElement("article");box.className="item";const name=document.createElement("strong");name.textContent=d.name||"নাম নেই";const blood=document.createElement("span");blood.className="tag";blood.textContent=d.blood_group||"";const info=document.createElement("p");info.textContent=`ফোন: ${d.phone||"নেই"} · WhatsApp: ${d.whatsapp||"নেই"}`;const area=document.createElement("p");area.textContent=`এলাকা: ${[d.upazila,d.district].filter(Boolean).join(", ")}`;const date=document.createElement("p");date.className="muted";date.textContent="জমার তারিখ: "+(d.created_at?new Date(d.created_at).toLocaleString("bn-BD"):"");const actions=document.createElement("div");actions.className="row";const yes=document.createElement("button");yes.className="approve";yes.textContent="অনুমোদন করুন";yes.addEventListener("click",()=>updateStatus(d.id,"approved"));const no=document.createElement("button");no.className="reject";no.textContent="বাতিল করুন";no.addEventListener("click",()=>updateStatus(d.id,"rejected"));actions.append(yes,no);box.append(name,document.createTextNode(" "),blood,info,area,date,actions);$("donorList").appendChild(box);});}
async function updateStatus(id,status){const {error}=await db.from("donors").update({status}).eq("id",id);if(error){msg("dashMsg","পরিবর্তন করা যায়নি: "+error.message,"bad");return;}msg("dashMsg",status==="approved"?"আবেদন অনুমোদিত হয়েছে।":"আবেদন বাতিল করা হয়েছে।","ok");await loadDonors();}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.currentTarget);msg("loginMsg","লগইন যাচাই হচ্ছে…");const {error}=await db.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});if(error){msg("loginMsg","লগইন হয়নি: "+error.message,"bad");return;}try{if(!(await isAdmin())){await db.auth.signOut();msg("loginMsg","এই অ্যাকাউন্টকে অ্যাডমিন অনুমতি দেওয়া হয়নি।","bad");return;}showDashboard(true);await loadDonors();}catch(err){await db.auth.signOut();msg("loginMsg","অ্যাডমিন যাচাই হয়নি: "+err.message,"bad");}});
$("logoutBtn").addEventListener("click",async()=>{await db.auth.signOut();showDashboard(false);$("loginForm").reset();});
(async()=>{const {data}=await db.auth.getSession();if(data.session){try{if(await isAdmin()){showDashboard(true);await loadDonors();}else await db.auth.signOut();}catch(e){await db.auth.signOut();}}})();
</script></body></html>
